<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Looping</title>
</head>
<body>
    <h2>Looping (th:each)</h2>
    <ul>
        <li th:each="no: ${modelNumber}">
            <span th:text="${no}"></span>
        </li>
    </ul>
</body>
</html>
