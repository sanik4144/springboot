<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h2>Login Here</h2>

<div th:if="${errorMsg}">
    <h3 style="color:red;" th:text="${errorMsg}"></h3>
</div>

<form th:action="@{/loginForm}" method="post" th:object="${user}">
    Email: <input type="text" th:field="*{email}"> <br><br>
    Password: <input type="text" th:field="*{password}"> <br><br>
    <input type="submit" value="Login">
</form>
</body>
</html>
