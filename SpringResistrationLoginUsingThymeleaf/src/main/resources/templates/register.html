<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h2>Register Here</h2>

    <div th:if="${successMsg}">
        <h3 style="color:green;" th:text="${successMsg}"></h3>
    </div>

    <div th:if="${errorMsg}">
        <h3 style="color:red;" th:text="${errorMsg}"></h3>
    </div>

    <form th:action="@{/regForm}" method="post" th:object="${user}">
        Name: <input type="text" th:field="*{name}"> <br><br>
        Email: <input type="text" th:field="*{email}"> <br><br>
        Password: <input type="text" th:field="*{password}"> <br><br>
        Phone No: <input type="text" th:field="*{phoneno}"> <br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
